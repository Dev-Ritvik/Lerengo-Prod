name: Web CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  web-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      # L5 fix: the `semgrep` npm package (0.0.1) was a placeholder that never
      # ran any scan. Replaced with the real Semgrep CLI via pip. Runs from the
      # web app directory against its source; ERROR-severity findings block the
      # pipeline (`--error` => non-zero exit).
      - name: Semgrep security scan
        working-directory: web
        run: |
          python -m pip install --upgrade pip
          pip install semgrep
          semgrep scan --config auto --error --severity ERROR src middleware.ts

      - name: Build
        run: npm run build
